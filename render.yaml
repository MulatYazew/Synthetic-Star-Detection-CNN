services:
  - type: web
    name: starnet-demo
    env: docker
    dockerfilePath: ./Dockerfile
    # "starter" avoids cold starts. The free plan works too but the instance
    # sleeps after ~15 min of inactivity and the next request pays a
    # 30-60s cold start while the container rebuilds/restarts — fine for a
    # course demo nobody hits continuously, not great if you want it to feel
    # instant. Change to `plan: free` if cost matters more than that.
    plan: starter
    healthCheckPath: /_stcore/health
    envVars:
      # No secrets currently exist for this app: there's no
      # .streamlit/secrets.toml in the repo and no st.secrets[...] calls
      # anywhere in codes/ or demo/app.py (confirmed by grep). Nothing to
      # add here today — this is a placeholder for if you introduce
      # env-var-based config later, e.g.:
      # - key: SOME_API_KEY
      #   sync: false   # set the real value in the Render dashboard, not here
      []
